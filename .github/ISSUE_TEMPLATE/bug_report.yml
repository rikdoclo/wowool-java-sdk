name: Bug Report
description: Create a report to help us improve the Wowool Java SDK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example or steps to reproduce the behavior.
      placeholder: |
        ```java
        try (WowoolEngine engine = WowoolEngine.create()) {
            // ...
        }
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack Trace / Error Output
      description: Paste any error messages or stack traces if applicable.
      render: shell
  - type: dropdown
    id: java_version
    attributes:
      label: Java Version
      description: Which Java runtime are you using?
      options:
        - Java 22
        - Java 23
        - Java 24+
        - Other (please specify)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon / ARM64)
        - macOS (Intel / x86_64)
        - Linux (Ubuntu / Debian / RHEL)
        - Windows 11 / Server
    validations:
      required: true
